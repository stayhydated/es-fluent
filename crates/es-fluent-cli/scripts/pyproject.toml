[project]
dependencies = [  ]
description = "Helper scripts for the es-fluent-cli GitHub Action."
name = "es-fluent-cli-action-scripts"
requires-python = ">=3.11"
version = "0.0.0"

[dependency-groups]
dev = [ "pytest>=9.1.1" ]

[tool.uv]
python-preference = "system"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [ "." ]
