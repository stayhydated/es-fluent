name: es-fluent-cli
description: Run es-fluent check in CI.
inputs:
  version:
    description: "Optional es-fluent-cli version to install from prebuilt binaries with cargo-binstall. When omitted, a release-tag action ref selects the version; other refs build from source with cargo install."
    required: false
    default: ""
  path:
    description: Existing path to a crate/workspace root, its Cargo.toml, or a path inside a crate (passed as --path).
    required: false
    default: .
  package:
    description: Optional package name to filter workspace crates (passed as --package); cannot be combined with ignore.
    required: false
    default: ""
  all_locales:
    description: Include non-fallback validation, fallback-copy warnings, and orphan-file checks. Must be true or false.
    required: false
    default: "false"
  ignore:
    description: "Crates to skip (comma- or newline-separated; blank entries ignored), passed as --ignore; cannot be combined with package."
    required: false
    default: ""
  no_fallback_copy_check:
    description: Disable fallback-copy warnings for all-locale checks. Must be true or false and requires all_locales=true.
    required: false
    default: "false"
  force_run:
    description: Run the generated runner through Cargo, ignoring the staleness cache. Must be true or false.
    required: false
    default: "false"
  toolchain:
    description: Rust toolchain to install for running the CLI.
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: "v0.16.0"

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: false

    - name: Install cargo-binstall
      if: inputs.version != '' || startsWith(github.action_ref, 'es-fluent-cli-v')
      uses: cargo-bins/cargo-binstall@main

    - name: Install es-fluent-cli
      shell: bash
      env:
        ES_FLUENT_CLI_VERSION: ${{ inputs.version }}
        ES_FLUENT_ACTION_REF: ${{ github.action_ref }}
      run: |
        uv run --frozen --no-dev --project "${GITHUB_ACTION_PATH}/scripts" \
          python "${GITHUB_ACTION_PATH}/scripts/install_cli.py"

    - name: Run es-fluent
      shell: bash
      env:
        ES_FLUENT_PATH: ${{ inputs.path }}
        ES_FLUENT_PACKAGE: ${{ inputs.package }}
        ES_FLUENT_ALL_LOCALES: ${{ inputs.all_locales }}
        ES_FLUENT_IGNORE: ${{ inputs.ignore }}
        ES_FLUENT_NO_FALLBACK_COPY_CHECK: ${{ inputs.no_fallback_copy_check }}
        ES_FLUENT_FORCE_RUN: ${{ inputs.force_run }}
      run: |
        uv run --frozen --no-dev --project "${GITHUB_ACTION_PATH}/scripts" \
          python "${GITHUB_ACTION_PATH}/scripts/run_check.py"
