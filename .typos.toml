# Configuration for the typos spell checker utility (<https://github.com/crate-ci/typos>).

[files]
extend-exclude = [ "*.ftl", "*.snap" ]

[default.extend-words]
# French translation text in the locale-preservation regression fixture.
Existant = "Existant"
# French greeting in the module-localizer locale fallback fixture.
Allo = "Allo"
