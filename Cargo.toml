[workspace]
members = [
  "crates/es-fluent",
  "crates/es-fluent-build",
  "crates/es-fluent-cli",
  "crates/es-fluent-cli-helpers",
  "crates/es-fluent-runner",
  "crates/es-fluent-shared",
  "crates/es-fluent-derive-core",
  "crates/es-fluent-toml",
  "crates/es-fluent-derive",
  "crates/es-fluent-generate",
  "crates/es-fluent-lang",
  "crates/es-fluent-lang-macro",
  "crates/es-fluent-manager-core",
  "crates/es-fluent-manager-macros",
  "crates/es-fluent-manager-embedded",
  "crates/es-fluent-manager-bevy",
  "crates/es-fluent-manager-dioxus",
  "examples/example-shared-lib",
  "examples/bevy-example",
  "examples/readme",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/es-fluent"
rust-version = "1.99"
version = "0.21.0"

[workspace.dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
askama = "0.16.1"
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
bevy = { default-features = false, version = "0.20.0" }
blake3 = "1.8.7"
bon = "3.10.3"
camino = "1.2.6"
cargo-manifest = "0.21.0"
cargo_metadata = "0.23.1"
chrono = { default-features = false, features = [ "std" ], version = "0.4.45" }
clap = "4.6.7"
colored = "3.1.1"
console_error_panic_hook = "0.1.7"
criterion = { default-features = false, features = [ "cargo_bench_support" ], version = "0.8.2" }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
darling = "0.24.1"
derive_more = "2.1.1"
dioxus = { default-features = false, version = "0.7.10" }
dioxus-core = { default-features = false, version = "0.7.10" }
dioxus-core-macro = { default-features = false, version = "0.7.10" }
dioxus-hooks = { default-features = false, version = "0.7.10" }
dioxus-signals = { default-features = false, version = "0.7.10" }
dioxus-ssr = { default-features = false, version = "0.7.10" }
es-fluent = { path = "crates/es-fluent", version = "0.21.0" }
es-fluent-build = { path = "crates/es-fluent-build", version = "0.21.0" }
es-fluent-derive = { path = "crates/es-fluent-derive", version = "0.21.0" }
es-fluent-derive-core = { path = "crates/es-fluent-derive-core", version = "0.21.0" }
es-fluent-generate = { path = "crates/es-fluent-generate", version = "0.21.0" }
es-fluent-lang = { path = "crates/es-fluent-lang", version = "0.21.0" }
es-fluent-lang-macro = { path = "crates/es-fluent-lang-macro", version = "0.21.0" }
es-fluent-manager-bevy = { default-features = false, path = "crates/es-fluent-manager-bevy", version = "0.21.0" }
es-fluent-manager-core = { default-features = false, path = "crates/es-fluent-manager-core", version = "0.21.0" }
es-fluent-manager-dioxus = { default-features = false, path = "crates/es-fluent-manager-dioxus", version = "0.21.0" }
es-fluent-manager-embedded = { path = "crates/es-fluent-manager-embedded", version = "0.21.0" }
es-fluent-manager-macros = { path = "crates/es-fluent-manager-macros", version = "0.21.0" }
es-fluent-runner = { path = "crates/es-fluent-runner", version = "0.21.0" }
es-fluent-shared = { path = "crates/es-fluent-shared", version = "0.21.0" }
es-fluent-toml = { path = "crates/es-fluent-toml", version = "0.21.0" }
fluent-bundle = "0.16.0"
fluent-fallback = "0.7.2"
fluent-syntax = "0.12.0"
fs-err = "3.3.2"
futures = "0.3.34"
getset = "0.1.7"
globset = "0.4.20"
heck = "0.5.0"
icu_calendar = "2.4.0"
icu_datetime = "2.4.0"
icu_experimental = "0.7.0"
icu_locale = "2.4.0"
icu_provider = { features = [ "sync" ], version = "2.4.0" }
icu_time = "2.4.0"
indexmap = "2.14.2"
indicatif = "0.18.6"
insta = "1.49.0"
intl-memoizer = "0.5.3"
inventory = "0.3.25"
jiff = "0.2.38"
miette = "7.6.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
parking_lot = "0.13.0"
path-slash = "0.2.1"
predicates = "3.1.4"
prettyplease = "0.3.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
proptest = { default-features = false, features = [ "std" ], version = "1.12.0" }
quote = "1.0.47"
ratatui = "0.30.2"
rstest = "0.28.0"
rust-embed = "8.13.0"
rustc-hash = "2.1.3"
serde = "1.0.229"
serde_json = "1.0.154"
serial_test = "4.0.1"
similar = "3.2.0"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
strum = "0.28.0"
syn = "3.0.9"
temp-env = "0.3.6"
tempfile = "3.27.0"
terminal-link = "0.1.0"
thiserror = "2.0.21"
throbber-widgets-tui = "0.11.1"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
treelog = "0.0.6"
trybuild = "1.0.122"
unic-langid = "0.9.6"
walkdir = "2.5.0"
wasm-bindgen = "0.2.129"
web = { path = "web" }
web-sys = "0.3.106"
writeable = "0.6.4"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
