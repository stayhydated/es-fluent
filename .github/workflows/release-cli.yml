name: release-cli

# Attach prebuilt `cargo-es-fluent` binaries to the release-plz release so the
# CLI can be installed with `cargo binstall es-fluent-cli`.
#
# This workflow is invoked directly by ci.yml after release-plz runs, because
# events created with the default GITHUB_TOKEN (the release-plz release and its
# tag) do not trigger event-based workflows. `workflow_dispatch` is available to
# backfill assets for an already-published tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload binaries for.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload binaries for.
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  upload-binary:
    name: upload (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and upload cargo-es-fluent
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cargo-es-fluent
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          zip: all
          locked: true
          manifest-path: crates/es-fluent-cli/Cargo.toml
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ github.token }}
