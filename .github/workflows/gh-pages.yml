name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: stayhydated/shared/.github/workflows/deploy-pages-compat.yml@714a26e25ae1d5a30b3972949ae3514a362e7165
    with:
      build-command: |
        env -u RUSTC_WRAPPER cargo run --locked -p xtask -- build bevy-demo
        cargo run --locked -p xtask -- build book
        cargo run --locked -p xtask -- build llms-txt
        cargo run --locked -p xtask -- build web
      install-trunk: true
