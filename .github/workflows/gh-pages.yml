name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: stayhydated/shared/.github/workflows/deploy-pages-compat.yml@76ccdbb3dd025f12c4ea8a73bfee3f2f9433dbd1
    with:
      build-command: |
        env -u RUSTC_WRAPPER cargo run --locked -p xtask -- build bevy-demo
        cargo run --locked -p xtask -- build book
        cargo run --locked -p xtask -- build llms-txt
        cargo run --locked -p xtask -- build web
      install-trunk: true
