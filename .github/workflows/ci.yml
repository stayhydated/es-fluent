name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache

jobs:
  es-fluent-local-cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Run local es-fluent-cli check
        run: cargo run --locked -p es-fluent-cli -- es-fluent check --path . --all-locales

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: cargo test --workspace --all-features --locked
          - os: macos-latest
            command: cargo test --workspace --all-features --locked
          - os: windows-latest
            command: cargo test --workspace --all-features --locked

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Run tests
        run: ${{ matrix.command }}

      - name: Smoke-test FTL benchmarks
        if: runner.os == 'Linux'
        run: cargo test -p es-fluent-generate --bench ftl --locked

  dioxus-manager-feature-matrix:
    name: dioxus manager (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-features
            command: cargo check -p es-fluent-manager-dioxus --no-default-features --locked
          - name: client-test
            command: cargo test -p es-fluent-manager-dioxus --no-default-features --features client --locked
          - name: ssr-test
            command: cargo test -p es-fluent-manager-dioxus --no-default-features --features ssr --locked
          - name: client-ssr-test
            command: cargo test -p es-fluent-manager-dioxus --no-default-features --features client,ssr --locked
          - name: client-wasm-check
            command: cargo check -p es-fluent-manager-dioxus --target wasm32-unknown-unknown --no-default-features --features client --locked

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Run check
        run: ${{ matrix.command }}

  dioxus-integration-surface:
    name: dioxus integration surface (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            command: cargo test -p es-fluent-manager-core --locked
          - name: web-test
            command: cargo test -p web --lib --locked
          - name: web-check
            command: cargo check -p web --locked

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Run check
        run: ${{ matrix.command }}

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Lint code
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Verify packaged release graph
        run: cargo publish --workspace --dry-run --locked

      - name: Check tracked lockfiles for drift
        run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.lock'

  machete:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"
      - name: Install pinned Machete
        run: cargo binstall cargo-machete --version '=0.9.2' --locked --no-confirm
      - name: Check unused dependencies
        run: cargo machete

  action-scripts:
    name: action scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Run action script tests
        run: uv run --frozen --project crates/es-fluent-cli/scripts pytest crates/es-fluent-cli/scripts

  rust-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"

      - name: Install cargo-llvm-cov
        shell: bash
        run: cargo binstall cargo-llvm-cov --version '=0.9.1' --locked --no-confirm

      - name: Run coverage
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --cobertura --output-path=target/cobertura.xml --exclude xtask --exclude web --locked

      - name: Codecov publish
        uses: codecov/codecov-action@v7
        with:
          files: target/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov housekeeping
        shell: bash
        run: |
          rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig

  quality:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Taplo and ShellCheck
        uses: taiki-e/install-action@v2.87.27
        with:
          tool: "taplo@0.10.0,shellcheck@0.11.0"
          checksum: true
          fallback: none
      - name: Check TOML formatting
        run: taplo fmt --check
      - name: Check Markdown
        uses: rvben/rumdl@v0.2.79
        with:
          version: "0.2.78"
          command: check
          path: "."
          fail-on-error: "true"
      - name: Prevent checkout-controlled typos executable reuse
        run: test ! -e typos && test ! -L typos
      - name: Check spelling
        uses: crate-ci/typos@v1.51.1
        with:
          write_changes: false
      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"
      - name: Install derive sorter
        run: cargo binstall cargo-sort-derives --version '=0.13.0' --locked --no-confirm
      - name: Check derive order
        run: cargo sort-derives --check
      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12 # includes ShellCheck and pyflakes
      - name: Check shell scripts
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck

  dependencies:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dependency advisories and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1 # cargo-deny 0.20.2
        with:
          rust-version: "stable"
          arguments: "--workspace --all-features --locked"
          command: check
          command-arguments: "advisories sources"

  feature-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Check each library feature selection independently
        run: |
          cargo check -p es-fluent --lib --locked
          cargo check -p es-fluent --lib --locked --no-default-features
          cargo check -p es-fluent --lib --locked --no-default-features --features derive
          cargo check -p es-fluent --lib --locked --no-default-features --features icu-datetime
          cargo check -p es-fluent --lib --locked --no-default-features --features chrono
          cargo check -p es-fluent --lib --locked --no-default-features --features jiff
          cargo check -p es-fluent-manager-core --lib --locked --no-default-features
          cargo check -p es-fluent-manager-embedded --lib --locked --no-default-features
          cargo check -p es-fluent-manager-bevy --lib --locked --no-default-features

  publication-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MDBOOK_BUILD__CREATE_MISSING: "false"
      RUSTC_WRAPPER: ""
      TRUNK_SKIP_VERSION_CHECK: "true"
      TRUNK_BUILD_LOCKED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: cargo-bins/cargo-binstall@v1.25.3
        with:
          version: "1.25.1"
      - name: Install publication tools
        run: cargo binstall dioxus-cli --version '=0.7.9' --locked --no-confirm
      - name: Install Trunk
        run: cargo binstall trunk --version '=0.21.14' --locked --no-confirm
      - name: Check the publication dependency lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build publication artifacts
        run: |
          cargo run --locked -p xtask -- build bevy-demo
          cargo run --locked -p xtask -- build book
          cargo run --locked -p xtask -- build llms-txt
          cargo run --locked -p xtask -- build web
      - name: Check tracked lockfiles for drift
        run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.lock'

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - es-fluent-local-cli
      - test
      - dioxus-manager-feature-matrix
      - dioxus-integration-surface
      - fmt
      - clippy
      - docs
      - package
      - machete
      - action-scripts
      - rust-coverage
      - quality
      - dependencies
      - feature-checks
    outputs:
      cli_tag: ${{ steps.cli_tag.outputs.tag }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Publish unpublished crate versions
        id: release_plz
        uses: release-plz/action@v0.5.140
        with:
          command: release
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Resolve es-fluent-cli release tag
        id: cli_tag
        if: steps.release_plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release_plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "es-fluent-cli") | .tag' <<<"$RELEASES")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-cli-binaries:
    name: release-cli binaries
    needs: release
    if: needs.release.outputs.cli_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-cli.yml
    with:
      tag: ${{ needs.release.outputs.cli_tag }}
